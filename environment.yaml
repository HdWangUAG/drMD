name: drMD
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ambertools=23
  # openmm pinned: conda-forge 8.6 builds link CUDA 13, whose PTX fails to load
  # on CUDA 12 drivers (CUDA_ERROR_UNSUPPORTED_PTX_VERSION).
  - openmm=8.2.*
  - cuda-version=12.4
  - openbabel
  # mdtraj / mdanalysis from conda-forge so that they share the environment's OpenMP runtime
  # (the PyPI wheels bundle their own libgomp)
  - mdtraj
  - mdanalysis
  # interaction profiling (src/ExaminationRoom/drPLIP.py)
  - plip
  - pango
  - pip
  - pip:
    - -r requirements.txt
